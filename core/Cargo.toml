[package]
name = "hyperplane-wasm"
version = "0.2.0"
edition = "2024"
authors = ["Jatin Mehta"]
description = "Numerical core for Hyperplane: ML algorithms compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
